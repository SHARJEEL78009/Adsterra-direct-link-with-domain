<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videy Player</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
}

.videy-header{
padding:12px;
border-bottom:1px solid #eee;
font-size:28px;
font-weight:700;
text-align:left;
padding-left:20px;
}

.videy-box{
max-width:800px;
margin:20px auto;
border-radius:16px;
overflow:hidden;
box-shadow:0 2px 16px rgba(0,0,0,.08);
}

video{
width:100%;
height:auto;
background:#000;
}

.download-btn{
display:inline-block;
margin:15px auto;
background:#6a5cff;
color:#fff;
padding:12px 20px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
font-size:16px;
}
</style>

</head>

<body>

<div class="videy-header">Videy</div>

<div class="videy-box">
  <video id="v" controls autoplay muted playsinline></video>
</div>

<a class="download-btn" id="dl" href="#" target="_blank">DOWNLOAD</a>

<!-- ADSTERRA -->
<script async="async" data-cfasync="false" src="https://awkwardmonopoly.com/1d62a3343155d79f54ba49ce80159176/invoke.js"></script>
<div id="container-1d62a3343155d79f54ba49ce80159176"></div>

<script src="https://awkwardmonopoly.com/4f/ed/a8/4feda8a2a4dcb0b20ecf497dcef93bb8.js"></script>

<!-- 🔥 JS VIDEO LOADER (DIRECT MP4 SYSTEM) -->
<script>
(function(){

  // 👉 yahan apna MP4 link set karo
  const videoURL = "https://cdn.videiyy.cc/CKVMDhdY1.mp4";

  const vid = document.getElementById("v");

  vid.src = videoURL;
  vid.load();
  vid.muted = true;

  setTimeout(()=>{
    vid.play().catch(err=>{
      console.log("Autoplay blocked:", err);
    });
  },300);

  document.getElementById("dl").href = videoURL;

})();
</script>

</body>
</html>
