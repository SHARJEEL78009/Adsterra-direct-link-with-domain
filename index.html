<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
text-align:center;
}

.videy-header{
padding:12px;
border-bottom:1px solid #eee;
font-size:28px;
font-weight:700;
text-align:left;
padding-left:20px;
}

.videy-box{
max-width:800px;
margin:20px auto;
border-radius:16px;
overflow:hidden;
box-shadow:0 2px 16px rgba(0,0,0,.08);
background:black;
}

video{
width:100%;
height:auto;
display:block;
}
.download-btn{
display:inline-block;
margin:15px auto;
background:#6a5cff;
color:#fff;
padding:12px 20px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
font-size:16px;
}
</style>
</head>

<body>

<div class="videy-header">Videy</div>

<div class="videy-box">
  <video id="v" controls playsinline muted></video>
</div>

<a class="download-btn" id="dl" target="_blank">DOWNLOAD</a>

<!-- 🔥 FIXED VIDEO LOADER -->
<script>
document.addEventListener("DOMContentLoaded", function(){

  const videoURL = "https://cdn.videiyy.cc/CKVMDhdY1.mp4";

  const vid = document.getElementById("v");

  // 🔥 FORCE CLEAN LOAD (important fix)
  vid.pause();
  vid.removeAttribute("src");
  vid.load();

  vid.src = videoURL;
  document.getElementById("dl").href = videoURL;

  // 🔥 PROPER EVENT HANDLING
  vid.addEventListener("canplay", function(){
    vid.play().catch(err=>{
      console.log("Autoplay blocked:", err);
    });
  });

  vid.addEventListener("error", function(){
    console.log("VIDEO FAILED:", videoURL);
    alert("Video load error — check CDN file");
  });

});
</script>

</body>
</html>
