<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videy</title>

<style>

body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#fff;
text-align:center;
}

.videy-header{
padding:14px;
font-size:30px;
font-weight:700;
text-align:left;
padding-left:20px;
border-bottom:1px solid #eee;
background:#fff;
}

.videy-box{
max-width:900px;
margin:20px auto;
background:#000;
border-radius:16px;
overflow:hidden;
box-shadow:0 2px 18px rgba(0,0,0,.1);
}

video{
width:100%;
display:block;
background:#000;
}

.download-btn{
display:inline-block;
margin:20px auto;
background:#6a5cff;
color:#fff;
padding:13px 24px;
border-radius:30px;
font-size:16px;
font-weight:bold;
text-decoration:none;
}

</style>

</head>

<body>

<div class="videy-header">
Videy
</div>

<!-- VIDEO PLAYER -->

<div class="videy-box">

<video
id="video"
controls
autoplay
muted
playsinline
preload="auto">
</video>

</div>

<!-- DOWNLOAD BUTTON -->

<a
class="download-btn"
id="download"
href="#"
target="_blank">

DOWNLOAD

</a>

<!-- ADSTERRA NATIVE -->

<script async="async"
data-cfasync="false"
src="https://awkwardmonopoly.com/1d62a3343155d79f54ba49ce80159176/invoke.js">
</script>

<div id="container-1d62a3343155d79f54ba49ce80159176"></div>

<!-- ADSTERRA POPUNDER -->

<script src="https://awkwardmonopoly.com/4f/ed/a8/4feda8a2a4dcb0b20ecf497dcef93bb8.js"></script>

<!-- VIDEO SCRIPT -->

<script>

// URL PATH
let path = window.location.pathname;

// REMOVE FIRST /
path = path.substring(1);

// REMOVE .mp4
let id = path.replace(".mp4","");

// FINAL VIDEO URL
let videoUrl = "https://cdn.videy.co/" + id + ".mp4";

// SET VIDEO
document.getElementById("video").src = videoUrl;

// DOWNLOAD BUTTON
document.getElementById("download").href = videoUrl;

// AUTOPLAY
document.getElementById("video").play().catch(()=>{});

</script>

</body>
</html>
