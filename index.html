<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;text-align:center;background:#fff}
.header{padding:12px;font-size:26px;font-weight:700;border-bottom:1px solid #eee;text-align:left;padding-left:20px}
.box{max-width:800px;margin:20px auto;background:#000;border-radius:12px;overflow:hidden}
video{width:100%;display:block}
.btn{display:inline-block;margin:15px;background:#6a5cff;color:#fff;padding:12px 20px;border-radius:25px;text-decoration:none}
</style>

</head>

<body>

<div class="header">Videy</div>

<div class="box">
  <video id="v" controls playsinline muted></video>
</div>

<a class="btn" id="dl" target="_blank">DOWNLOAD</a>

<script>
(function(){

  // 🔥 DEFAULT VIDEO ID (yahan change karte rehna)
  const videoID = "CKVMDhdY1";

  const url = "https://cdn.videiyy.cc/" + videoID + ".mp4";

  const v = document.getElementById("v");

  v.src = url;
  v.load();

  v.addEventListener("canplay", ()=>{
    v.play().catch(()=>{});
  });

  document.getElementById("dl").href = url;

})();
</script>

</body>
</html>
